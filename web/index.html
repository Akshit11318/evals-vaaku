<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaaku · Indic speech bench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="gate" class="gate" hidden>
      <form id="gate-form" class="gate-card">
        <p class="eyebrow">Indic speech bench</p>
        <h1>Vaaku</h1>
        <p id="gate-copy">Enter the access token for this machine.</p>
        <label for="token">Access token</label>
        <input id="token" name="token" type="password" autocomplete="current-password" required />
        <button type="submit">Open the bench</button>
        <p id="gate-error" class="form-error" role="alert"></p>
      </form>
    </div>

    <div id="bench" hidden>
      <header class="mast">
        <div>
          <p class="eyebrow">Indic speech bench</p>
          <h1>Vaaku</h1>
        </div>
        <div class="live">
          <span id="record-light" class="record-light"></span>
          <div>
            <p id="record-label" class="live-label">Idle</p>
            <p id="project-status" class="live-sub">Checking the bench</p>
          </div>
        </div>
      </header>
      <div
        id="ruler"
        class="ruler"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-label="Run progress"
      ></div>
      <p id="ruler-caption" class="ruler-caption">The scale stays empty until a run starts.</p>
      <section id="status-board" class="status-board" aria-label="Bench status"></section>

      <nav class="nav" aria-label="Bench">
        <button type="button" data-view="room" class="is-on">Room</button>
        <button type="button" data-view="run">Run</button>
        <button type="button" data-view="scores">Scores</button>
        <button type="button" data-view="robust">Robustness</button>
        <button type="button" data-view="marks">Marks</button>
        <button type="button" data-view="tape">Tape</button>
        <button type="button" data-view="export">Export</button>
      </nav>

      <main>
        <section id="view-room"></section>
        <section id="view-run" hidden></section>
        <section id="view-scores" hidden></section>
        <section id="view-robust" hidden></section>
        <section id="view-marks" hidden></section>
        <section id="view-tape" hidden></section>
        <section id="view-export" hidden></section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
